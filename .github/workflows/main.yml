
name: Build VeltorGameHub PS4 PKG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar VeltorGameHub
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          set -eu
          test -f Makefile
          test -f main.cpp
          echo "Arquivos principais encontrados."
          find . -maxdepth 3 -type f -print | sort

      - name: Compilar create-gp4 oficial
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y golang-go git

          git clone --depth 1 \
            https://github.com/OpenOrbis/create-gp4.git \
            /tmp/create-gp4-src

          cd /tmp/create-gp4-src/cmd/create-gp4
          GO111MODULE=auto GOOS=linux GOARCH=amd64 \
            go build -o /tmp/create-gp4 .

          test -x /tmp/create-gp4
          /tmp/create-gp4 -h

      - name: Compilar e gerar PKG
        run: |
          set -eu

          test -f sce_sys/icon0.png || {
            echo "ERRO: falta sce_sys/icon0.png no projeto."
            exit 1
          }

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v /tmp/create-gp4:/tmp/create-gp4:ro \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -eu
              export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK

              echo "=== Verificando ferramentas ==="
              test -x /lib/OpenOrbisSDK/bin/linux/create-eboot
              test -x /lib/OpenOrbisSDK/bin/linux/PkgTool.Core
              test -x /tmp/create-gp4

              echo "=== Gerando pacote ==="
              make

              echo "=== Conferindo arquivo PKG ==="
              find /workspace -maxdepth 1 -type f -name "*.pkg" -print
              test -n "$(find /workspace -maxdepth 1 -type f -name "*.pkg" -print -quit)"
            '

      - name: Disponibilizar pacote para download
        uses: actions/upload-artifact@v4
        with:
          name: VeltorGameHub-PS4-PKG
          path: "*.pkg"
          if-no-files-found: error
          retention-days: 7
