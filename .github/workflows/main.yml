
name: Build Veltor GameHub PS4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PS4 PKG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail

          test -f Makefile
          test -f main.cpp
          test -s sce_sys/icon0.png
          test -s sce_sys/param.sfo

          mkdir -p diagnostico

          echo "Arquivos do projeto verificados."

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Compilar create-gp4
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/OpenOrbis/create-gp4.git \
            /tmp/create-gp4-src

          cd /tmp/create-gp4-src/cmd/create-gp4

          GOOS=linux GOARCH=amd64 \
            go build -o /tmp/create-gp4 .

          test -x /tmp/create-gp4

      - name: Baixar OpenOrbis Toolchain
        run: docker pull openorbisofficial/toolchain:v0.5.1

      - name: Compilar ELF, diagnosticar e gerar FSELF
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v /tmp/create-gp4:/tmp/create-gp4:ro \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -euo pipefail

              SDK=/lib/OpenOrbisSDK
              ELF=x64/Debug/VeltorGameHub.elf
              TOOL=$SDK/bin/linux/create-eboot

              mkdir -p diagnostico

              echo "=== Verificando ferramentas ==="
              test -x "$TOOL"
              test -x "$SDK/bin/linux/PkgTool.Core"
              test -x /tmp/create-gp4

              echo "=== Limpando build anterior ==="
              make clean

              echo "=== Compilando ELF ==="
              make "$ELF"

              test -s "$ELF"

              echo "=== Informações do ELF ==="
              ls -lh "$ELF"

              echo "=== Cabeçalho ELF ==="
              readelf -h "$ELF" \
                | tee diagnostico/elf-header.txt

              echo "=== Program Headers ==="
              readelf -l "$ELF" \
                | tee diagnostico/elf-program-headers.txt

              echo "=== Seções ELF ==="
              readelf -S "$ELF" \
                | tee diagnostico/elf-sections.txt

              echo "=== Símbolos GOT/PLT ==="
              readelf -S "$ELF" \
                | grep -Ei "got|plt" \
                | tee diagnostico/elf-got-plt.txt || true

              echo "=== Informações do create-eboot ==="
              "$TOOL" --help \
                > diagnostico/create-eboot-help.txt 2>&1 || true

              echo "=== Gerando FSELF ==="

              set +e
              "$TOOL" -in="$ELF" -out=eboot.bin \
                > diagnostico/create-eboot.log 2>&1
              FSELF_STATUS=$?
              set -e

              cat diagnostico/create-eboot.log

              echo "$FSELF_STATUS" \
                > diagnostico/create-eboot-exit-code.txt

              if [ "$FSELF_STATUS" -ne 0 ]; then
                echo "ERRO: create-eboot falhou."
                exit "$FSELF_STATUS"
              fi

              test -s eboot.bin

              echo "=== FSELF gerado ==="
              ls -lh eboot.bin

              echo "=== Gerando GP4 ==="
              make pkg.gp4
              test -s pkg.gp4

              echo "=== Gerando PKG ==="
              make VeltorGameHub.pkg
              test -s VeltorGameHub.pkg

              echo "=== BUILD CONCLUÍDO ==="
              ls -lh VeltorGameHub.pkg
            '

      - name: Publicar diagnóstico do ELF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltorGameHub-Diagnostico
          path: diagnostico/
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar PKG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VeltorGameHub-PS4-PKG
          path: VeltorGameHub.pkg
          if-no-files-found: error
          retention-days: 7
