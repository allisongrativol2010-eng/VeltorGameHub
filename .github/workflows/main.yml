
name: Veltor GameHub - PS4 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Veltor GameHub PKG
    runs-on: ubuntu-22.04

    steps:
      # 1. Baixar o projeto
      - name: Baixar repositório
        uses: actions/checkout@v4

      # 2. Verificar arquivos necessários
      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostico

          test -f Makefile
          test -f main.cpp
          test -s sce_sys/icon0.png
          test -s sce_sys/param.sfo

          echo "Estrutura do projeto OK."

      # 3. Instalar Go
      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # 4. Compilar create-fself usando o arquivo correto para Linux
      - name: Compilar create-fself
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/OpenOrbis/create-fself.git \
            /tmp/create-fself-src

          cd /tmp/create-fself-src/cmd/create-fself

          echo "===== VERIFICANDO MÓDULO LINUX ====="
          test -f go-linux.mod

          echo "===== BAIXANDO DEPENDÊNCIAS ====="
          go mod download -modfile=go-linux.mod

          echo "===== COMPILANDO CREATE-FSELF ====="
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
            -mod=mod \
            -modfile=go-linux.mod \
            -o /tmp/create-fself .

          chmod +x /tmp/create-fself

          echo "===== TESTANDO EXECUTÁVEL ====="
          /tmp/create-fself -h \
            > "$GITHUB_WORKSPACE/diagnostico/create-fself-help.txt" 2>&1 || true

          test -x /tmp/create-fself

      # 5. Compilar create-gp4
      - name: Compilar create-gp4
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/OpenOrbis/create-gp4.git \
            /tmp/create-gp4-src

          cd /tmp/create-gp4-src/cmd/create-gp4

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o /tmp/create-gp4 .

          chmod +x /tmp/create-gp4

          test -x /tmp/create-gp4

      # 6. Baixar OpenOrbis SDK
      - name: Baixar OpenOrbis Toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker pull openorbisofficial/toolchain:v0.5.1

      # 7. Diagnosticar ferramentas
      - name: Diagnosticar Toolchain
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm openorbisofficial/toolchain:v0.5.1 bash -c '
            set -eu

            echo "===== CLANG ====="
            clang++ --version

            echo "===== LLD ====="
            ld.lld --version

            echo "===== SDK ====="
            ls -lh /lib/OpenOrbisSDK/link.x
            ls -lh /lib/OpenOrbisSDK/lib/crt1.o

            echo "===== BIBLIOTECAS ====="
            ls -lh /lib/OpenOrbisSDK/lib/libkernel*

            echo "===== PKGTOOL ====="
            ls -lh /lib/OpenOrbisSDK/bin/linux/PkgTool.Core
          ' 2>&1 | tee diagnostico/toolchain.txt

      # 8. Compilar ELF
      - name: Compilar ELF
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -eu

              export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK

              echo "===== LIMPANDO BUILD ====="
              make clean

              echo "===== COMPILANDO ELF ====="
              make x64/Debug/VeltorGameHub.elf

              ELF=x64/Debug/VeltorGameHub.elf

              test -s "$ELF"

              echo "===== CABEÇALHO ELF ====="
              readelf -h "$ELF"

              echo "===== SEGMENTOS ELF ====="
              readelf -l "$ELF"

              echo "===== SEÇÕES ELF ====="
              readelf -S "$ELF"

              echo "===== ARQUIVO GERADO ====="
              ls -lh "$ELF"
            ' 2>&1 | tee diagnostico/compilacao-elf.txt

      # 9. Converter ELF em EBOOT
      - name: Gerar EBOOT
        shell: bash
        run: |
          set -euo pipefail

          ELF="x64/Debug/VeltorGameHub.elf"

          test -s "$ELF"
          test -x /tmp/create-fself

          echo "===== GERANDO OELF E EBOOT ====="

          /tmp/create-fself \
            -in "$ELF" \
            --out "VeltorGameHub.oelf" \
            --eboot "eboot.bin" \
            --paid 0x3800000000000011 \
            2>&1 | tee diagnostico/fself.txt

          test -s VeltorGameHub.oelf
          test -s eboot.bin

          echo "===== ARQUIVOS GERADOS ====="
          ls -lh VeltorGameHub.oelf eboot.bin

      # 10. Gerar projeto GP4
      - name: Gerar GP4
        shell: bash
        run: |
          set -euo pipefail

          test -x /tmp/create-gp4
          test -s eboot.bin
          test -s sce_sys/param.sfo
          test -s sce_sys/icon0.png

          echo "===== GERANDO GP4 ====="

          /tmp/create-gp4 \
            -out=pkg.gp4 \
            --content-id=IV0000-VLTG00001_00-VELTORGAMEHUB0000 \
            --files "eboot.bin sce_sys/param.sfo sce_sys/icon0.png" \
            2>&1 | tee diagnostico/gp4.txt

          test -s pkg.gp4

          ls -lh pkg.gp4

      # 11. Gerar pacote PKG
      - name: Gerar PKG
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -eu

              PKGTOOL=/lib/OpenOrbisSDK/bin/linux/PkgTool.Core

              test -x "$PKGTOOL"
              test -s pkg.gp4

              echo "===== EMPACOTANDO ====="

              "$PKGTOOL" --build pkg.gp4 VeltorGameHub.pkg

              test -s VeltorGameHub.pkg

              echo "===== PKG GERADO ====="
              ls -lh VeltorGameHub.pkg
            ' 2>&1 | tee diagnostico/pkg.txt

      # 12. Salvar diagnósticos mesmo se falhar
      - name: Publicar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltorGameHub-Diagnosticos
          path: diagnostico/
          if-no-files-found: warn
          retention-days: 14

      # 13. Disponibilizar PKG
      - name: Publicar PKG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VeltorGameHub-PS4-PKG
          path: VeltorGameHub.pkg
          if-no-files-found: error
          retention-days: 30
