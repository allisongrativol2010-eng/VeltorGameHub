
name: Build Veltor GameHub PS4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Veltor GameHub
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o projeto
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Conferir arquivos do projeto
      - name: Verificar estrutura
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Estrutura do projeto ==="
          find . -maxdepth 3 -type f -print | sort

          test -f Makefile
          test -f main.cpp
          test -s sce_sys/icon0.png
          test -s sce_sys/param.sfo

          echo "Arquivos obrigatórios encontrados."

      # 3. Preparar Go
      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # 4. Compilar create-gp4
      - name: Compilar create-gp4 oficial
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/OpenOrbis/create-gp4.git \
            /tmp/create-gp4-src

          cd /tmp/create-gp4-src/cmd/create-gp4

          GOOS=linux GOARCH=amd64 \
            go build -o /tmp/create-gp4 .

          test -x /tmp/create-gp4

          echo "create-gp4 compilado."
          /tmp/create-gp4 -h

      # 5. Baixar e preparar a imagem OpenOrbis
      - name: Preparar OpenOrbis Toolchain
        shell: bash
        run: |
          set -euo pipefail

          docker pull openorbisofficial/toolchain:v0.5.1

          echo "Imagem OpenOrbis preparada."

      # 6. Compilar somente o ELF
      - name: Compilar ELF
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v /tmp/create-gp4:/tmp/create-gp4:ro \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -eu

              export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK

              echo "=== Verificando SDK ==="

              test -x /lib/OpenOrbisSDK/bin/linux/create-eboot
              test -x /lib/OpenOrbisSDK/bin/linux/PkgTool.Core
              test -x /tmp/create-gp4

              echo "=== Limpando build anterior ==="
              make clean

              echo "=== Compilando ELF ==="
              make x64/Debug/VeltorGameHub.elf

              test -s x64/Debug/VeltorGameHub.elf

              echo "ELF criado."
              ls -lh x64/Debug/VeltorGameHub.elf
            '

      # 7. Inspecionar o ELF antes do FSELF
      - name: Diagnosticar ELF
        shell: bash
        run: |
          set -euo pipefail

          ELF="x64/Debug/VeltorGameHub.elf"

          test -s "$ELF"

          echo "=== Cabeçalho ELF ==="
          readelf -h "$ELF"

          echo "=== Program Headers ==="
          readelf -l "$ELF"

          echo "=== Seções ELF ==="
          readelf -S "$ELF"

          echo "=== Tamanho do ELF ==="
          ls -lh "$ELF"

      # 8. Gerar EBOOT, GP4 e PKG
      - name: Gerar pacote PS4
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v /tmp/create-gp4:/tmp/create-gp4:ro \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -eu

              export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK

              echo "=== Gerando EBOOT / FSELF ==="
              make eboot.bin

              test -s eboot.bin

              echo "=== Gerando GP4 ==="
              make pkg.gp4

              test -s pkg.gp4

              echo "=== Gerando PKG ==="
              make VeltorGameHub.pkg

              test -s VeltorGameHub.pkg

              echo "=== BUILD CONCLUÍDO ==="
              ls -lh VeltorGameHub.pkg
            '

      # 9. Disponibilizar o pacote
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: VeltorGameHub-PS4-PKG
          path: VeltorGameHub.pkg
          if-no-files-found: error
          retention-days: 7
