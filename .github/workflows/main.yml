
name: Build Veltor GameHub PS4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Veltor GameHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar projeto
        shell: bash
        run: |
          set -euo pipefail

          test -f Makefile
          test -f main.cpp
          test -s sce_sys/icon0.png
          test -s sce_sys/param.sfo

          mkdir -p diagnostico

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Compilar create-gp4
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/OpenOrbis/create-gp4.git \
            /tmp/create-gp4-src

          cd /tmp/create-gp4-src/cmd/create-gp4

          GOOS=linux GOARCH=amd64 \
            go build -o /tmp/create-gp4 .

          test -x /tmp/create-gp4

      - name: Baixar OpenOrbis
        run: docker pull openorbisofficial/toolchain:v0.5.1

      - name: Diagnosticar Toolchain
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -eu

              {
                echo "=== CLANG ==="
                clang++ --version

                echo "=== LLD ==="
                ld.lld --version

                echo "=== CREATE EBOOT ==="
                ls -lh /lib/OpenOrbisSDK/bin/linux/create-eboot

                echo "=== LINKER SCRIPT ==="
                cat /lib/OpenOrbisSDK/link.x

                echo "=== CRT1 ==="
                ls -lh /lib/OpenOrbisSDK/lib/crt1.o

                echo "=== BIBLIOTECAS ==="
                ls -lh /lib/OpenOrbisSDK/lib/libkernel*
              } > diagnostico/toolchain.txt 2>&1
            '

      - name: Compilar ELF
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v /tmp/create-gp4:/tmp/create-gp4:ro \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -eu

              export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK

              make clean
              make x64/Debug/VeltorGameHub.elf

              ELF=x64/Debug/VeltorGameHub.elf

              test -s "$ELF"

              readelf -h "$ELF" \
                > diagnostico/elf-header.txt

              readelf -l "$ELF" \
                > diagnostico/elf-program-headers.txt

              readelf -S "$ELF" \
                > diagnostico/elf-sections.txt

              readelf -d "$ELF" \
                > diagnostico/elf-dynamic.txt || true

              readelf -s "$ELF" \
                > diagnostico/elf-symbols.txt

              ls -lh "$ELF"
            '

      - name: Gerar FSELF com log completo
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -eu

              TOOL=/lib/OpenOrbisSDK/bin/linux/create-eboot
              ELF=x64/Debug/VeltorGameHub.elf

              test -s "$ELF"

              echo "=== Executando create-eboot ==="

              set +e
              "$TOOL" -in="$ELF" -out=eboot.bin \
                > diagnostico/create-eboot.log 2>&1
              RESULT=$?
              set -e

              cat diagnostico/create-eboot.log
              echo "$RESULT" > diagnostico/create-eboot-exit-code.txt

              if [ "$RESULT" -ne 0 ]; then
                echo "Falha na conversão ELF para FSELF."
                exit "$RESULT"
              fi

              test -s eboot.bin
              ls -lh eboot.bin
            '

      - name: Gerar GP4 e PKG
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v /tmp/create-gp4:/tmp/create-gp4:ro \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -eu

              export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK

              test -s eboot.bin

              make pkg.gp4
              make VeltorGameHub.pkg

              test -s VeltorGameHub.pkg
            '

      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltorGameHub-Diagnostico
          path: diagnostico/
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar PKG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VeltorGameHub-PS4-PKG
          path: VeltorGameHub.pkg
          if-no-files-found: error
          retention-days: 7
