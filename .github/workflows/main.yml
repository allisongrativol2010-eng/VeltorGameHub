
name: Build Veltor GameHub PS4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PS4 PKG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar projeto
        shell: bash
        run: |
          set -euo pipefail

          test -f Makefile
          test -f main.cpp
          test -s sce_sys/icon0.png
          test -s sce_sys/param.sfo

          echo "=== Arquivos do projeto ==="
          find . -maxdepth 3 -type f -print | sort

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Compilar create-gp4
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/OpenOrbis/create-gp4.git \
            /tmp/create-gp4-src

          cd /tmp/create-gp4-src/cmd/create-gp4

          GOOS=linux GOARCH=amd64 \
            go build -o /tmp/create-gp4 .

          test -x /tmp/create-gp4
          echo "create-gp4 pronto."

      - name: Baixar OpenOrbis Toolchain
        run: docker pull openorbisofficial/toolchain:v0.5.1

      - name: Compilar ELF e diagnosticar
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v /tmp/create-gp4:/tmp/create-gp4:ro \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -eu

              export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK

              echo "=== Verificando SDK ==="
              test -x /lib/OpenOrbisSDK/bin/linux/create-eboot
              test -x /lib/OpenOrbisSDK/bin/linux/PkgTool.Core
              test -x /tmp/create-gp4

              echo "=== Limpando build ==="
              make clean

              echo "=== Compilando ELF ==="
              make x64/Debug/VeltorGameHub.elf

              ELF=x64/Debug/VeltorGameHub.elf
              test -s "$ELF"

              echo "=== ELF gerado ==="
              ls -lh "$ELF"

              echo "=== Seções ELF ==="
              if command -v readelf >/dev/null 2>&1; then
                readelf -S "$ELF"
              elif command -v llvm-readelf >/dev/null 2>&1; then
                llvm-readelf -S "$ELF"
              else
                echo "readelf não disponível dentro do container."
              fi

              echo "=== Verificando GOT.PL T ==="
              if command -v readelf >/dev/null 2>&1; then
                readelf -S "$ELF" | grep -E "got|plt" || true
              fi
            '

      - name: Inspecionar ELF no runner
        shell: bash
        run: |
          set -euo pipefail

          ELF="x64/Debug/VeltorGameHub.elf"

          test -s "$ELF"

          echo "=== Cabeçalho ==="
          readelf -h "$ELF"

          echo "=== Program Headers ==="
          readelf -l "$ELF"

          echo "=== Seções GOT e PLT ==="
          readelf -S "$ELF" | grep -E "got|plt" || true

      - name: Gerar EBOOT FSELF
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -eu

              TOOL=/lib/OpenOrbisSDK/bin/linux/create-eboot
              ELF=x64/Debug/VeltorGameHub.elf

              test -s "$ELF"

              echo "=== Gerando FSELF diretamente ==="
              "$TOOL" -in="$ELF" -out=eboot.bin

              test -s eboot.bin

              echo "EBOOT gerado:"
              ls -lh eboot.bin
            '

      - name: Gerar GP4 e PKG
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v /tmp/create-gp4:/tmp/create-gp4:ro \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -c '
              set -eu

              export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK

              test -s eboot.bin
              test -s sce_sys/param.sfo
              test -s sce_sys/icon0.png

              echo "=== Gerando GP4 ==="
              make pkg.gp4

              test -s pkg.gp4

              echo "=== Gerando PKG ==="
              make VeltorGameHub.pkg

              test -s VeltorGameHub.pkg

              echo "=== PKG GERADO ==="
              ls -lh VeltorGameHub.pkg
            '

      - name: Publicar PKG
        uses: actions/upload-artifact@v4
        with:
          name: VeltorGameHub-PS4-PKG
          path: VeltorGameHub.pkg
          if-no-files-found: error
          retention-days: 7
