
name: Veltor GameHub - PS4 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Veltor GameHub PKG
    runs-on: ubuntu-22.04

    env:
      CONTENT_ID: IV0000-VLTG00001_00-VELTORGAMEHUB000
      TITLE_ID: VLTG00001
      APP_TITLE: Veltor GameHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostico sce_sys

          test -f Makefile
          test -f main.cpp
          test -s sce_sys/icon0.png

          echo "Projeto encontrado."
          echo "CONTENT_ID: $CONTENT_ID"
          echo "TITLE_ID: $TITLE_ID"

      - name: Generate PARAM.SFO
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import struct
          from pathlib import Path

          content_id = os.environ["CONTENT_ID"]
          title_id = os.environ["TITLE_ID"]
          title = os.environ["APP_TITLE"]

          if len(content_id) != 36:
              raise SystemExit(
                  f"CONTENT_ID inválido: {len(content_id)} caracteres"
              )

          if len(title_id) != 9:
              raise SystemExit(
                  f"TITLE_ID inválido: {len(title_id)} caracteres"
              )

          entries = [
              ("APP_TYPE", 0x0404, struct.pack("<I", 1)),
              ("APP_VER", 0x0204, b"01.00\0"),
              ("ATTRIBUTE", 0x0404, struct.pack("<I", 0)),
              ("CATEGORY", 0x0204, b"gd\0"),
              ("CONTENT_ID", 0x0204, content_id.encode("ascii") + b"\0"),
              ("FORMAT", 0x0404, struct.pack("<I", 0)),
              ("PARENTAL_LEVEL", 0x0404, struct.pack("<I", 0)),
              ("SYSTEM_VER", 0x0404, struct.pack("<I", 0x05000000)),
              ("TITLE", 0x0204, title.encode("utf-8") + b"\0"),
              ("TITLE_ID", 0x0204, title_id.encode("ascii") + b"\0"),
              ("VERSION", 0x0204, b"01.00\0"),
          ]

          keys = bytearray()
          values = bytearray()
          records = []

          for key, fmt, value in entries:
              key_offset = len(keys)
              keys.extend(key.encode("ascii") + b"\0")

              while len(values) % 4:
                  values.append(0)

              value_offset = len(values)
              values.extend(value)

              records.append((
                  key_offset,
                  fmt,
                  len(value),
                  len(value),
                  value_offset
              ))

          key_table_offset = 20 + 16 * len(records)
          data_table_offset = key_table_offset + len(keys)

          header = struct.pack(
              "<4sIIII",
              b"\0PSF",
              0x00000101,
              key_table_offset,
              data_table_offset,
              len(records)
          )

          index_table = b"".join(
              struct.pack("<HHIII", *record)
              for record in records
          )

          output = header + index_table + keys + values

          path = Path("sce_sys/param.sfo")
          path.write_bytes(output)

          print(f"PARAM.SFO criado: {path}")
          print(f"Tamanho: {len(output)} bytes")
          print(f"CONTENT_ID: {content_id}")
          print(f"TITLE_ID: {title_id}")
          PY

          test -s sce_sys/param.sfo

      - name: Validate PARAM.SFO
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import struct
          from pathlib import Path

          data = Path("sce_sys/param.sfo").read_bytes()

          if len(data) < 20:
              raise SystemExit("PARAM.SFO muito pequeno")

          if data[:4] != b"\0PSF":
              raise SystemExit("Assinatura PSF inválida")

          version, key_off, data_off, count = struct.unpack_from(
              "<IIII", data, 4
          )

          if version != 0x00000101:
              raise SystemExit("Versão PSF inesperada")

          if 20 + count * 16 > len(data):
              raise SystemExit("Tabela de índices inválida")

          if key_off > len(data) or data_off > len(data):
              raise SystemExit("Offset inválido")

          found = {}

          for i in range(count):
              pos = 20 + i * 16

              key_idx, fmt, length, max_len, data_idx = (
                  struct.unpack_from("<HHIII", data, pos)
              )

              key_start = key_off + key_idx

              if key_start >= len(data):
                  raise SystemExit("Índice de chave inválido")

              key_end = data.find(b"\0", key_start)

              if key_end < 0 or key_end >= data_off:
                  raise SystemExit("Chave inválida")

              key = data[key_start:key_end].decode("ascii")

              value_start = data_off + data_idx
              value_end = value_start + length

              if value_start < data_off or value_end > len(data):
                  raise SystemExit(f"Valor inválido: {key}")

              raw = data[value_start:value_end]

              if fmt == 0x0204:
                  value = raw.rstrip(b"\0").decode(
                      "utf-8", errors="strict"
                  )
              elif fmt == 0x0404:
                  if len(raw) != 4:
                      raise SystemExit(f"Campo inteiro inválido: {key}")
                  value = struct.unpack("<I", raw)[0]
              else:
                  value = raw

              found[key] = value
              print(f"{key}: {value}")

          expected = {
              "CONTENT_ID": os.environ["CONTENT_ID"],
              "TITLE_ID": os.environ["TITLE_ID"],
              "TITLE": os.environ["APP_TITLE"],
          }

          for key, expected_value in expected.items():
              if found.get(key) != expected_value:
                  raise SystemExit(
                      f"ERRO: {key} esperado {expected_value!r}, "
                      f"recebido {found.get(key)!r}"
                  )

          required = {
              "APP_TYPE",
              "APP_VER",
              "ATTRIBUTE",
              "CATEGORY",
              "CONTENT_ID",
              "FORMAT",
              "PARENTAL_LEVEL",
              "SYSTEM_VER",
              "TITLE",
              "TITLE_ID",
              "VERSION",
          }

          missing = required - found.keys()

          if missing:
              raise SystemExit(
                  "Campos ausentes: " + ", ".join(sorted(missing))
              )

          print("PARAM.SFO passou nas verificações.")
          PY

          file sce_sys/param.sfo \
            | tee diagnostico/param-sfo.txt

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build create-fself
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/OpenOrbis/create-fself.git \
            /tmp/create-fself-src

          cd /tmp/create-fself-src/cmd/create-fself

          test -f go-linux.mod

          go mod download -modfile=go-linux.mod

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
            -mod=mod \
            -modfile=go-linux.mod \
            -o /tmp/create-fself .

          chmod +x /tmp/create-fself

          file /tmp/create-fself \
            | tee "$GITHUB_WORKSPACE/diagnostico/create-fself.txt"

      - name: Build create-gp4
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/OpenOrbis/create-gp4.git \
            /tmp/create-gp4-src

          cd /tmp/create-gp4-src/cmd/create-gp4

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o /tmp/create-gp4 .

          chmod +x /tmp/create-gp4

          file /tmp/create-gp4 \
            | tee "$GITHUB_WORKSPACE/diagnostico/create-gp4.txt"

      - name: Pull OpenOrbis SDK
        shell: bash
        run: |
          set -euo pipefail
          docker pull openorbisofficial/toolchain:v0.5.1

      - name: Diagnose SDK
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            openorbisofficial/toolchain:v0.5.1 \
            bash -lc '
              set -eu

              export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK

              clang++ --version
              ld.lld --version

              test -f "$OO_PS4_TOOLCHAIN/link.x"
              test -f "$OO_PS4_TOOLCHAIN/lib/crt1.o"
              test -x "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"

              ls -lh \
                "$OO_PS4_TOOLCHAIN/link.x" \
                "$OO_PS4_TOOLCHAIN/lib/crt1.o" \
                "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
            ' 2>&1 | tee diagnostico/toolchain.txt

      - name: Compile PS4 ELF
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -lc '
              set -eu

              export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK

              make clean
              make x64/Debug/VeltorGameHub.elf

              ELF=x64/Debug/VeltorGameHub.elf

              test -s "$ELF"

              readelf -h "$ELF"
              readelf -l "$ELF"
              ls -lh "$ELF"
            ' 2>&1 | tee diagnostico/compilacao-elf.txt

      - name: Convert ELF to EBOOT
        shell: bash
        run: |
          set -euo pipefail

          test -s x64/Debug/VeltorGameHub.elf
          test -x /tmp/create-fself

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v /tmp/create-fself:/usr/local/bin/create-fself:ro \
            -w /workspace \
            -e OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK \
            openorbisofficial/toolchain:v0.5.1 \
            bash -lc '
              set -eu

              create-fself \
                -in x64/Debug/VeltorGameHub.elf \
                --out VeltorGameHub.oelf \
                --eboot eboot.bin \
                --paid 0x3800000000000011

              test -s VeltorGameHub.oelf
              test -s eboot.bin

              ls -lh VeltorGameHub.oelf eboot.bin
            ' 2>&1 | tee diagnostico/fself.txt

      - name: Generate GP4
        shell: bash
        run: |
          set -euo pipefail

          test -s eboot.bin
          test -s sce_sys/param.sfo
          test -s sce_sys/icon0.png

          /tmp/create-gp4 \
            -out=pkg.gp4 \
            --content-id="$CONTENT_ID" \
            --files "eboot.bin sce_sys/param.sfo sce_sys/icon0.png" \
            2>&1 | tee diagnostico/gp4.txt

          test -s pkg.gp4

          ls -lh pkg.gp4

      - name: Build PKG
        shell: bash
        run: |
          set -euo pipefail

          test -s pkg.gp4

          rm -rf pkg-output
          mkdir -p pkg-output

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -lc '
              set -eu

              PKGTOOL=/lib/OpenOrbisSDK/bin/linux/PkgTool.Core

              test -x "$PKGTOOL"

              "$PKGTOOL" pkg_build pkg.gp4 pkg-output

              find pkg-output -type f -print
            ' 2>&1 | tee diagnostico/pkg.txt

          mapfile -t PACKAGES < <(
            find pkg-output -type f -iname '*.pkg'
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo "ERRO: esperado exatamente um PKG."
            find pkg-output -maxdepth 4 -print
            exit 1
          fi

          cp "${PACKAGES[0]}" VeltorGameHub.pkg

          test -s VeltorGameHub.pkg
          ls -lh VeltorGameHub.pkg

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltorGameHub-Diagnostics
          path: diagnostico/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload PS4 PKG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VeltorGameHub-PS4-PKG
          path: VeltorGameHub.pkg
          if-no-files-found: error
          retention-days: 30
